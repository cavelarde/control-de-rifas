<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rifas Control</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;margin:0;padding:0}
body{background:#1a38a7;min-height:100vh;padding:18px;color:#222}
.app{width:100%;max-width:1100px;margin:auto}
.panel{background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 30px #0004}
.topbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.brand{font-weight:900;color:#1a38a7;font-size:1.35rem}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}
.btn-primary{background:#1a38a7;color:white}.btn-green{background:#0f9f6e;color:#fff}.btn-red{background:#e53855;color:#fff}.btn-gray{background:#64748b;color:#fff}
.config{background:#f4f7fb;border-radius:16px;padding:18px;margin-bottom:18px}
.config h2{color:#1a38a7;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.group label{display:block;font-weight:700;font-size:.85rem;margin-bottom:5px}
.group input,.group select{width:100%;padding:11px;border:2px solid #d5dce5;border-radius:9px;font-size:1rem}
.group.full{grid-column:1/-1}
.config-actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.title{text-align:center;color:#f3b313;font-size:2rem;font-weight:900}
.subtitle{text-align:center;color:#666;margin:4px 0 10px}
.prize{text-align:center;background:linear-gradient(#fce055,#f3a812);padding:10px 20px;border-radius:50px;font-size:1.35rem;font-weight:900;width:max-content;max-width:100%;margin:0 auto 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{color:#fff;border-radius:14px;padding:11px;text-align:center}.libres{background:#1ea1e1}.debe{background:#e53855}.pagado{background:#0f9f6e}
.stat strong{display:block;font-size:1.4rem;margin-top:3px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1;min-width:180px;padding:10px;border:2px solid #d5dce5;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;max-height:65vh;overflow:auto;padding:3px}
.number{aspect-ratio:1;border:2px solid #bde0fe;border-radius:8px;background:#eaf5ff;color:#005691;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer;position:relative}
.number.debe{background:#ffe8ec;border-color:#e53855;color:#b51e38}
.number.pagado{background:#e3f8f0;border-color:#0f9f6e;color:#087654}
.number small{position:absolute;bottom:3px;font-size:.48rem}
.empty{text-align:center;padding:35px;color:#777}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}
.modal-card{background:#fff;width:100%;max-width:440px;border-radius:20px;padding:22px;max-height:95vh;overflow:auto}
.modal h2{text-align:center;color:#1a38a7;margin-bottom:16px}
.actions{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.rifas-list{display:grid;gap:10px;margin-top:12px}
.rifa-card{border:2px solid #dbe4ef;border-radius:13px;padding:13px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.rifa-card b{color:#1a38a7}.muted{color:#666;font-size:.85rem}
@media(max-width:650px){
 .form-grid{grid-template-columns:1fr}.group.full{grid-column:auto}
 .grid{grid-template-columns:repeat(5,1fr);gap:6px}.number{font-size:.9rem}
 .stats{gap:6px}.stat{font-size:.72rem}.stat strong{font-size:1.15rem}
 .title{font-size:1.55rem}
}
</style>
</head>
<body>
<div class="app">
<div class="panel">

<div class="topbar">
  <div class="brand">🎟️ RIFAS CONTROL</div>
  <div>
    <button class="btn-primary" onclick="openRifaConfig()">⚙️ Configurar rifa</button>
    <button class="btn-green" onclick="newRifa()">＋ Nueva rifa</button>
  </div>
</div>

<div class="config" id="configPanel" style="display:none">
  <h2>Configuración de la rifa</h2>
  <div class="form-grid">
    <div class="group">
      <label>Encabezado / nombre de la rifa</label>
      <input id="cfgTitulo" placeholder="Ej: GRAN RIFA DE MOTO">
    </div>
    <div class="group">
      <label>Premio</label>
      <input id="cfgPremio" placeholder="Ej: Moto Honda XR 150">
    </div>
    <div class="group full">
      <label>Imagen del premio</label>
      <input id="cfgImagen" type="file" accept="image/*">
      <div id="imagenActual" class="muted" style="margin-top:5px"></div>
    </div>
    <div class="group">
      <label>Valor por número</label>
      <input id="cfgValor" type="number" min="0" placeholder="20000">
    </div>
    <div class="group">
      <label>Cantidad de números</label>
      <select id="cfgCantidad">
        <option value="100">100 (00 - 99)</option>
        <option value="1000">1.000 (000 - 999)</option>
        <option value="10000">10.000 (0000 - 9999)</option>
      </select>
    </div>
    <div class="group">
      <label>Fecha del sorteo</label>
      <input id="cfgFecha" type="date">
    </div>
    <div class="group">
      <label>Organizador / contacto</label>
      <input id="cfgContacto" placeholder="Nombre o teléfono">
    </div>
  </div>
  <div class="config-actions">
    <button class="btn-primary" onclick="saveRifaConfig()">💾 Guardar configuración</button>
    <button class="btn-gray" onclick="closeRifaConfig()">Cerrar</button>
    <button class="btn-red" onclick="deleteCurrentRifa()">🗑️ Eliminar esta rifa</button>
  </div>
</div>

<div id="rifaHeader">
  <div class="title" id="rifaTitulo">RIFA CONTROL PANEL</div>
  <div class="subtitle" id="rifaInfo">Configura tu primera rifa</div>
  <div class="prize" id="rifaPremio">$0</div>
  <div id="premioImagenBox" style="display:none;margin:0 auto 18px;max-width:420px">
    <img id="premioImagen" alt="Imagen del premio" style="width:100%;max-height:260px;object-fit:contain;border-radius:16px;box-shadow:0 5px 18px #0003">
  </div>
</div>

<div class="stats">
 <div class="stat libres">LIBRES<strong id="statLibres">0</strong></div>
 <div class="stat debe">DEBE<strong id="statDebe">0</strong></div>
 <div class="stat pagado">PAGADO<strong id="statPagado">0</strong></div>
</div>

<div class="toolbar">
  <input id="searchNumber" placeholder="🔎 Buscar número..." oninput="renderGrid()">
  <button class="btn-gray" onclick="showRifas()">🎟️ Mis rifas</button>
  <button class="btn-primary" onclick="refresh()">🔄 Actualizar</button>
</div>

<div id="grid" class="grid"></div>
<div id="empty" class="empty" style="display:none">Crea una rifa para comenzar.</div>

</div>
</div>

<!-- Modal número -->
<div class="modal" id="numberModal">
 <div class="modal-card">
  <h2>Número <span id="modalNum"></span></h2>
  <div class="group"><label>Nombre del comprador</label><input id="buyerName" placeholder="Ej: Juan Pérez"></div>
  <div class="group" style="margin-top:12px"><label>Teléfono / nota</label><input id="buyerPhone" placeholder="Ej: 3001234567"></div>
  <div class="group" style="margin-top:12px"><label>Estado</label>
   <select id="buyerStatus"><option value="debe">DEBE</option><option value="pagado">PAGADO</option></select>
  </div>
  <div class="actions">
   <button class="btn-primary" onclick="saveNumber()">💾 Guardar</button>
   <button class="btn-green" onclick="quickStatus('pagado')">🟢 Marcar PAGADO</button>
   <button class="btn-red" onclick="quickStatus('debe')">🔴 Marcar DEBE</button>
   <button class="btn-gray" id="deleteBtn" onclick="deleteNumber()">Liberar número</button>
   <button onclick="closeNumberModal()">Cancelar</button>
  </div>
 </div>
</div>

<!-- Modal rifas -->
<div class="modal" id="rifasModal">
 <div class="modal-card">
  <h2>🎟️ Mis rifas</h2>
  <div id="rifasList" class="rifas-list"></div>
  <div class="actions"><button class="btn-green" onclick="newRifa()">＋ Crear nueva rifa</button><button onclick="closeRifas()">Cerrar</button></div>
 </div>
</div>

<script>
const STORAGE_KEY='rifas_app_v2';
let db=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
let currentRifaId=null, selectedNumber=null;

function saveDB(){localStorage.setItem(STORAGE_KEY,JSON.stringify(db));}

function init(){
 if(!db){
   db={rifas:[{
     id:crypto.randomUUID(),titulo:'GRAN RIFA',premio:'Configura tu premio',
     valor:0,cantidad:100,fecha:'',contacto:'',numeros:{}
   }]};
   saveDB();
 }
 if(!db.rifas.length) return;
 currentRifaId=currentRifaId||db.rifas[0].id;
 render();
}

function current(){return db.rifas.find(r=>r.id===currentRifaId)}

function formatNumber(i,cantidad){
 const digits=String(cantidad-1).length;
 return String(i).padStart(digits,'0');
}

function money(v){return '$'+Number(v||0).toLocaleString('es-CO')+' COP'}

function render(){
 const r=current();
 if(!r){document.getElementById('empty').style.display='block';return}
 document.getElementById('empty').style.display='none';
 document.getElementById('rifaTitulo').textContent=r.titulo||'RIFA';
 let info=[];
 if(r.cantidad) info.push(`${r.cantidad.toLocaleString('es-CO')} números`);
 if(r.fecha) info.push(`Sorteo: ${r.fecha}`);
 if(r.contacto) info.push(r.contacto);
 document.getElementById('rifaInfo').textContent=info.join(' • ');
 document.getElementById('rifaPremio').textContent=(r.premio||'SIN PREMIO')+(r.valor?' • '+money(r.valor):'');
 const imgBox=document.getElementById('premioImagenBox');
 const img=document.getElementById('premioImagen');
 if(r.imagen){img.src=r.imagen;imgBox.style.display='block'}else{img.src='';imgBox.style.display='none'}
 renderGrid(); updateStats();
}

function renderGrid(){
 const r=current(), grid=document.getElementById('grid');
 grid.innerHTML='';
 if(!r)return;
 const q=document.getElementById('searchNumber').value.trim();
 for(let i=0;i<r.cantidad;i++){
   const n=formatNumber(i,r.cantidad);
   if(q && !n.includes(q))continue;
   const data=r.numeros[n];
   const card=document.createElement('div');
   card.className='number '+(data?.status||'');
   card.textContent=n;
   card.onclick=()=>openNumber(n);
   if(data) {
     const tag=document.createElement('small');
     tag.textContent=data.status==='pagado'?'PAGADO':'DEBE';
     card.appendChild(tag);
   }
   grid.appendChild(card);
 }
}

function updateStats(){
 const r=current(); if(!r)return;
 let debe=0,pagado=0;
 Object.values(r.numeros).forEach(x=>{
   if(x.status==='pagado')pagado++; else debe++;
 });
 document.getElementById('statLibres').textContent=(r.cantidad-debe-pagado).toLocaleString('es-CO');
 document.getElementById('statDebe').textContent=debe.toLocaleString('es-CO');
 document.getElementById('statPagado').textContent=pagado.toLocaleString('es-CO');
}

function openNumber(n){
 selectedNumber=n;
 const d=current().numeros[n];
 document.getElementById('modalNum').textContent=n;
 document.getElementById('buyerName').value=d?.name||'';
 document.getElementById('buyerPhone').value=d?.phone||'';
 document.getElementById('buyerStatus').value=d?.status||'debe';
 document.getElementById('deleteBtn').style.display=d?'block':'none';
 document.getElementById('numberModal').style.display='flex';
}
function closeNumberModal(){document.getElementById('numberModal').style.display='none';selectedNumber=null}

function saveNumber(){
 if(selectedNumber===null)return;
 const r=current();
 const name=document.getElementById('buyerName').value.trim();
 const phone=document.getElementById('buyerPhone').value.trim();
 const status=document.getElementById('buyerStatus').value;
 if(!name){alert('Escribe el nombre del comprador.');return}
 r.numeros[selectedNumber]={name,phone,status,updatedAt:new Date().toISOString()};
 saveDB();render();closeNumberModal();
}
function quickStatus(s){document.getElementById('buyerStatus').value=s;saveNumber()}
function deleteNumber(){
 if(selectedNumber===null)return;
 if(confirm('¿Liberar el número '+selectedNumber+'?')){
   delete current().numeros[selectedNumber];
   saveDB();render();closeNumberModal();
 }
}

function openRifaConfig(){
 const r=current(); if(!r)return;
 cfgTitulo.value=r.titulo||'';cfgPremio.value=r.premio||'';cfgValor.value=r.valor||0;
 cfgCantidad.value=r.cantidad;cfgFecha.value=r.fecha||'';cfgContacto.value=r.contacto||'';
 document.getElementById('cfgImagen').value='';
 document.getElementById('imagenActual').textContent=r.imagen ? '✓ Ya hay una imagen guardada. Selecciona otra para reemplazarla.' : 'No hay imagen seleccionada.';
 configPanel.style.display='block';
}
function closeRifaConfig(){configPanel.style.display='none'}

async function saveRifaConfig(){
 const r=current();
 const newCantidad=Number(cfgCantidad.value);
 if(newCantidad!==r.cantidad && Object.keys(r.numeros).length){
   if(!confirm('Cambiar la cantidad puede dejar números fuera del nuevo rango. ¿Continuar?'))return;
   Object.keys(r.numeros).forEach(n=>{if(Number(n)>=newCantidad)delete r.numeros[n]});
 }
 r.titulo=cfgTitulo.value.trim()||'RIFA';
 r.premio=cfgPremio.value.trim()||'SIN PREMIO';
 r.valor=Number(cfgValor.value)||0;r.cantidad=newCantidad;
 r.fecha=cfgFecha.value;r.contacto=cfgContacto.value.trim();

 const file=document.getElementById('cfgImagen').files[0];
 if(file){
   if(file.size>2*1024*1024){
     alert('La imagen debe pesar máximo 2 MB.');
     return;
   }
   try{
     r.imagen=await resizeImage(file,900,700);
   }catch(e){
     alert('No se pudo cargar la imagen.');
     console.error(e);
     return;
   }
 }
 saveDB();closeRifaConfig();render();
}

function resizeImage(file,maxW,maxH){
 return new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onload=()=>{
     const img=new Image();
     img.onload=()=>{
       let w=img.width,h=img.height;
       const scale=Math.min(1,maxW/w,maxH/h);
       w=Math.round(w*scale);h=Math.round(h*scale);
       const canvas=document.createElement('canvas');
       canvas.width=w;canvas.height=h;
       canvas.getContext('2d').drawImage(img,0,0,w,h);
       resolve(canvas.toDataURL('image/jpeg',0.82));
     };
     img.onerror=reject;
     img.src=reader.result;
   };
   reader.onerror=reject;
   reader.readAsDataURL(file);
 });
}
function newRifa(){
 const titulo=prompt('Nombre de la nueva rifa:','RIFA DE MOTO');
 if(!titulo)return;
 const r={id:crypto.randomUUID(),titulo,premio:'Configura el premio',valor:0,cantidad:100,fecha:'',contacto:'',numeros:{}};
 db.rifas.push(r);currentRifaId=r.id;saveDB();closeRifas();render();openRifaConfig();
}

function deleteCurrentRifa(){
 if(db.rifas.length===1){alert('Debes conservar al menos una rifa.');return}
 if(confirm('¿Eliminar esta rifa y todos sus números?')){
   db.rifas=db.rifas.filter(r=>r.id!==currentRifaId);
   currentRifaId=db.rifas[0].id;saveDB();closeRifaConfig();render();
 }
}

function showRifas(){
 const list=document.getElementById('rifasList');list.innerHTML='';
 db.rifas.forEach(r=>{
   const d=document.createElement('div');d.className='rifa-card';
   const vendidos=Object.keys(r.numeros).length;
   d.innerHTML=`<div><b>${escapeHtml(r.titulo)}</b><div class="muted">${r.cantidad.toLocaleString('es-CO')} números • ${vendidos} ocupados</div></div>`;
   const b=document.createElement('button');b.className='btn-primary';b.textContent='Abrir';
   b.onclick=()=>{currentRifaId=r.id;closeRifas();render()};
   d.appendChild(b);list.appendChild(d);
 });
 document.getElementById('rifasModal').style.display='flex';
}
function closeRifas(){document.getElementById('rifasModal').style.display='none'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function refresh(){render()}

window.onclick=e=>{
 if(e.target===numberModal)closeNumberModal();
 if(e.target===rifasModal)closeRifas();
}
init();
</script>
</body>
</html>
